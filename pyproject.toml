[project]
name = "ai-data-analyst-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raghav", email = "rghvrtnydv2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "agent>=0.1.3",
    "faker>=40.41.0",
    "fastapi>=0.142.2",
    "openai>=3.24.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.23.0",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-data-analyst-agent = "ai_data_analyst_agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "setuptools>=84.2.0",
]
